server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: resume-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/resumes/**
            - id: job-description-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/job-descriptions/**
  data:
    redis:
      host: ${redis_host:${REDIS_HOST:localhost}}
      port: ${redis_port:${REDIS_PORT:6379}}
      username: ${redis_username:${REDIS_USERNAME:}}
      password: ${redis_password:${REDIS_PASSWORD:}}

jwt:
  secret:
    key: ${jwt_secret_key:${JWT_SECRET_KEY:thisismyecretkeyforemailservice12232321314y2urwbwedjdsfdfdsgbvcbcvnnpoiujyhgbvcdsxszdfdwd}}

cors:
  allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE