server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            - id: resume-service
              uri: ${RESUME_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/resumes/**
            - id: job-description-service
              uri: ${RESUME_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/job-descriptions/**
            - id: interview-service
              uri: ${INTERVIEW_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/interviews,/api/interviews/**

            - id: interview-websocket-service
              uri: ${INTERVIEW_WEBSOCKET_URL:ws://localhost:8083}
              predicates:
                - Path=/ws/interviews,/ws/interviews/**
  data:
    redis:
      host: ${redis_host:localhost}
      port: ${redis_port:6379}
      username: ${redis_username}
      password: ${redis_password}

jwt:
  secret:
    key: ${jwt_secret_key:${JWT_SECRET_KEY:}}
cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE
csrf:
  cookie:
    secure: ${CSRF_COOKIE_SECURE:true}
    same-site: ${CSRF_COOKIE_SAME_SITE:None}
