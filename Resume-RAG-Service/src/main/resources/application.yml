server:
  port: 8082

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  data:
    redis:
      host: ${redis_host:localhost}
      port: ${redis_port:6379}
      username: ${redis_username:}
      password: ${redis_password:}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      max-lifetime: 300000
      keepalive-time: 60000
      connection-timeout: 30000
      validation-timeout: 5000

  # =========================================================
  # SPRING AI
  # =========================================================

  ai:

    # Chat provider
    model:
      chat: openai
      embedding:
        text: google-genai

    # =======================================================
    # GROQ CHAT
    # =======================================================

#    openai:
#      api-key: ${GROQ_API_KEY}
#      base-url: https://api.groq.com/openai/v1
#
#      chat:
#        model: openai/gpt-oss-120b
#        temperature: 0.2
#        max-tokens: 4096
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: qwen/qwen3.8-27b
          temperature: 0.2
          extra-body:
            reasoning_effort: none
    # =======================================================
    # GOOGLE GEMINI EMBEDDINGS
    # =======================================================

    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}

          text:
            model: gemini-embedding-001
            dimensions: 768
            task-type: RETRIEVAL_DOCUMENT

  # =========================================================
  # JPA / Hibernate
  # =========================================================

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true


resume:
  rag:
    top-k: 5
    similarity-threshold: 0.40


# =============================================================
# Job Matching
# =============================================================

matching:
  required-skills-weight: 0.60
  preferred-skills-weight: 0.20
  responsibilities-weight: 0.20

# =============================================================
# Live Job Search (provider-agnostic facade -> SerpApi Google Jobs)
# =============================================================
job-search:
  cache:
    enabled: ${JOB_SEARCH_CACHE_ENABLED:true}
    ttl-minutes: ${JOB_SEARCH_CACHE_TTL_MINUTES:30}
    key-prefix: ${JOB_SEARCH_CACHE_KEY_PREFIX:jobs:search:v1:}
    job-details-key-prefix: ${JOB_SEARCH_JOB_DETAILS_CACHE_KEY_PREFIX:jobs:details:v1:}
  serpapi:
    base-url: ${SERPAPI_BASE_URL:https://serpapi.com/search.json}
    api-key: ${SERPAPI_API_KEY:}
    engine: ${SERPAPI_JOBS_ENGINE:google_jobs}
    listing-engine: ${SERPAPI_JOBS_LISTING_ENGINE:google_jobs_listing}
    language: ${SERPAPI_LANGUAGE:en}
    country: ${SERPAPI_COUNTRY:in}
    timeout-seconds: ${SERPAPI_TIMEOUT_SECONDS:20}
