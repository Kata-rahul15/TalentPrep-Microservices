server:
  port: 8082

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      max-lifetime: 300000
      keepalive-time: 60000
      connection-timeout: 30000
      validation-timeout: 5000

  # =========================================================
  # SPRING AI
  # =========================================================

  ai:

    # Chat provider
    model:
      chat: openai
      embedding:
        text: google-genai

    # =======================================================
    # GROQ CHAT
    # =======================================================

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1

      chat:
        model: openai/gpt-oss-120b
        temperature: 0.2
        max-tokens: 4096

    # =======================================================
    # GOOGLE GEMINI EMBEDDINGS
    # =======================================================

    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}

          text:
            model: gemini-embedding-001
            dimensions: 768
            task-type: RETRIEVAL_DOCUMENT

  # =========================================================
  # JPA / Hibernate
  # =========================================================

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true


# =============================================================
# RAG
# =============================================================

#rag:
#  top-k: 5
#  similarity-threshold: 0.50

resume:
  rag:
    top-k: 5
    similarity-threshold: 0.40
# =============================================================
# Job Matching
# =============================================================

matching:
  required-skills-weight: 0.60
  preferred-skills-weight: 0.20
  responsibilities-weight: 0.20
