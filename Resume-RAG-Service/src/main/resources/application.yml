server:
  port: 8082

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  data:
    redis:
      host: ${redis_host:localhost}
      port: ${redis_port:6379}
      username: ${redis_username:}
      password: ${redis_password:}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 300000
      keepalive-time: 60000
      connection-timeout: 30000
      validation-timeout: 5000

  # =========================================================
  # SPRING AI
  # =========================================================
  ai:
    # Qwen/Groq is the default ChatModel used by the career agent,
    # job-related AI flows, and existing ChatClient consumers.
    model:
      chat: openai
      embedding:
        text: google-genai

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${QWEN_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        options:
          model: ${QWEN_AGENT_MODEL:qwen/qwen3.8-27b}
          temperature: ${QWEN_TEMPERATURE:0.2}
          # Keep this within the model/provider's enforced output budget.
          # The resume analyzer does NOT use this model or this limit.
          max-tokens: ${QWEN_MAX_TOKENS:4096}
          extra-body:
            reasoning_effort: none

    # Gemini is used ONLY for embeddings / PGVector indexing and retrieval.
    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}
            task-type: RETRIEVAL_DOCUMENT

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

# =============================================================
# Dedicated GPT-OSS model for resume upload / semantic analysis
# =============================================================
# This is intentionally separate from spring.ai.openai above.
# spring.ai.openai -> Qwen/Groq -> Agent
# talentprep.ai.resume -> GPT-OSS/Groq -> ResumeAnalysisResponse
# =============================================================
talentprep:
  ai:
    resume:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${GROQ_API_KEY}
      model: ${RESUME_AI_MODEL:openai/gpt-oss-120b}
      temperature: ${RESUME_AI_TEMPERATURE:0.1}
      max-tokens: ${RESUME_AI_MAX_TOKENS:4096}

resume:
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.40}

matching:
  required-skills-weight: 0.60
  preferred-skills-weight: 0.20
  responsibilities-weight: 0.20

job-search:
  cache:
    enabled: ${JOB_SEARCH_CACHE_ENABLED:true}
    ttl-minutes: ${JOB_SEARCH_CACHE_TTL_MINUTES:30}
    key-prefix: ${JOB_SEARCH_CACHE_KEY_PREFIX:jobs:search:v1:}
    job-details-key-prefix: ${JOB_SEARCH_JOB_DETAILS_CACHE_KEY_PREFIX:jobs:details:v1:}
  serpapi:
    base-url: ${SERPAPI_BASE_URL:https://serpapi.com/search.json}
    api-key: ${SERPAPI_API_KEY:}
    engine: ${SERPAPI_JOBS_ENGINE:google_jobs}
    listing-engine: ${SERPAPI_JOBS_LISTING_ENGINE:google_jobs_listing}
    language: ${SERPAPI_LANGUAGE:en}
    country: ${SERPAPI_COUNTRY:in}
    timeout-seconds: ${SERPAPI_TIMEOUT_SECONDS:20}
